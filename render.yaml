# render.yaml — Render.com deployment config for Knowledge Base Agent backend
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: knowledge-base-agent-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT

    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false               
      - key: JINA_API_KEY
        sync: false               
      - key: USE_JINA_API
        value: "true"
      - key: FRONTEND_URL
        sync: false               
      - key: LANGCHAIN_TRACING_V2
        value: "false"           
      - key: LANGCHAIN_PROJECT
        value: "Knowledge-Base-Agent"
      - key: DB_URL
        sync: false               
      - key: SUPABASE_URL
        sync: false               
      - key: SUPABASE_SERVICE_KEY
        sync: false              


    disk:
      name: kb-persistent-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1                   

